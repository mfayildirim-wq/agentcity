<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent City</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 29 16 16 30 3 16Z' fill='%23d97757'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/vendor/xterm/css/xterm.css" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/panels.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three/build/three.module.js",
        "three/addons/": "/vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="screens"></div>
  <div id="stage"></div>
  <div id="labels"></div>

  <header class="hud hud-top">
    <div class="brand">
      <svg viewBox="0 0 32 32" class="brand-mark"><path d="M16 2 29 16 16 30 3 16Z" /></svg>
      <span>Agent City</span>
      <span class="live" id="live" title="Verbindung"></span>
    </div>
    <div class="stats" id="stats"></div>
    <div class="tools">
      <button class="icon-btn" id="btn-new" title="Neue Session (N)">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
      </button>
      <button class="icon-btn" id="btn-meeting" title="Besprechung (B)">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8" /></svg>
      </button>
      <button class="icon-btn" id="btn-board" title="Aufgaben-Board (T)">
        <svg viewBox="0 0 24 24"><path d="M4 4h4v16H4zM10 4h4v10h-4zM16 4h4v13h-4z" /></svg>
      </button>
      <button class="icon-btn" id="btn-timeline" title="Zeitstrahl (Z)">
        <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7v5l3 2" /></svg>
      </button>
      <button class="icon-btn" id="btn-archive" title="Archiv (A)">
        <svg viewBox="0 0 24 24"><path d="M3 4h18v4H3zM5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8M10 12h4" /></svg>
      </button>
      <button class="icon-btn" id="btn-settings" title="Agenten-Tools">
        <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" /></svg>
      </button>
      <button class="icon-btn" id="btn-legend" title="Legende">
        <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 8h.01M11 12h1v5h1" /></svg>
      </button>
      <button class="icon-btn" id="btn-demo" title="Demo-Modus">
        <svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z" /></svg>
      </button>
      <button class="icon-btn" id="btn-labels" title="Namen ein/aus">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h7" /></svg>
      </button>
      <button class="icon-btn" id="btn-reset" title="Ansicht zurücksetzen">
        <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5" /></svg>
      </button>
      <button class="icon-btn" id="btn-panel" title="Liste ein/aus">
        <svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM14 5v14" /></svg>
      </button>
    </div>
  </header>

  <aside class="panel" id="panel">
    <div class="panel-list" id="list"></div>
  </aside>

  <section class="detail hidden" id="detail"></section>

  <div class="legend hidden" id="legend"></div>

  <div class="chat-wrap hidden" id="chat"></div>
  <div class="chat-wrap hidden" id="meeting"></div>
  <div class="meet-pick hidden" id="meetpick"></div>
  <aside class="board-wrap hidden" id="board"></aside>
  <aside class="board-wrap hidden" id="archive"></aside>
  <div class="tl-wrap hidden" id="timeline"></div>
  <div class="perms" id="perms"></div>
  <div class="ns-wrap hidden" id="newsession"></div>
  <div class="ns-wrap hidden" id="settings"></div>

  <div class="empty hidden" id="empty">
    <div class="empty-mark"><svg viewBox="0 0 32 32"><path d="M16 2 29 16 16 30 3 16Z" /></svg></div>
    <div class="empty-title">Keine aktiven Sessions</div>
    <div class="empty-act">
      <button class="btn primary" id="btn-empty-new">Neue Session</button>
      <button class="btn ghost" id="btn-empty-demo">Demo ansehen</button>
    </div>
  </div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
